<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ストップウォッチ</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1 class="title">STOPWATCH</h1>

    <div class="display">
      <span id="minutes">00</span>
      <span class="colon">:</span>
      <span id="seconds">00</span>
      <span class="dot">.</span>
      <span id="milliseconds">00</span>
    </div>

    <div class="controls">
      <button id="lap-btn" class="btn btn-secondary" disabled>ラップ</button>
      <button id="start-btn" class="btn btn-primary">スタート</button>
      <button id="reset-btn" class="btn btn-secondary" disabled>リセット</button>
    </div>

    <div class="laps-wrapper">
      <ol id="laps" reversed></ol>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
