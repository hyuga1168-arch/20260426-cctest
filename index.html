<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ランダムポケモン</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header>
      <h1>ランダムポケモン</h1>
    </header>

    <main>
      <div class="card" id="card">
        <div class="card-inner" id="card-inner">
          <div class="pokemon-number" id="pokemon-number">#000</div>
          <div class="image-wrap">
            <img id="pokemon-img" src="" alt="" />
          </div>
          <div class="pokemon-name" id="pokemon-name">---</div>
          <div class="types" id="types"></div>
          <div class="stats" id="stats"></div>
          <div class="meta" id="meta"></div>
        </div>

        <div class="loading hidden" id="loading">
          <div class="pokeball">
            <div class="pokeball-top"></div>
            <div class="pokeball-mid"></div>
            <div class="pokeball-bot"></div>
          </div>
        </div>
      </div>

      <button class="roll-btn" id="roll-btn">
        <span>つぎのポケモン</span>
      </button>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
